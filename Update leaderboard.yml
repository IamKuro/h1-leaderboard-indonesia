name: Update leaderboard

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 WIB
  workflow_dispatch:
    inputs:
      country:
        description: "ISO 3166-1 alpha-2 country code"
        default: "ID"
        required: false
      resume:
        description: "Lanjutkan dari checkpoint run sebelumnya kalau ada"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape leaderboard dari HackerOne
        env:
          COUNTRY: ${{ github.event.inputs.country || 'ID' }}
          RESUME_FLAG: ${{ github.event.inputs.resume == 'true' && '--resume' || '' }}
        run: python scripts/scrape.py --country "$COUNTRY" --out-dir data $RESUME_FLAG

      - name: Commit kalau ada perubahan
        env:
          COUNTRY: ${{ github.event.inputs.country || 'ID' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan hari ini."
            exit 0
          fi
          git commit -m "data: $COUNTRY leaderboard $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          echo "push gagal setelah 3 percobaan" >&2
          exit 1

      - name: Commit checkpoint parsial kalau scrape gagal
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/.checkpoint_*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "checkpoint: scrape terputus, lanjut run berikutnya"
          git push || true